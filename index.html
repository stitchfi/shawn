<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shawn的作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  header { padding-block: 56px 32px; }
  h1 { font-size: clamp(34px, 8vw, 56px); font-weight: 900; margin: 0 0 4px; letter-spacing: .02em; text-wrap: balance; }
  h1 span { color: var(--green); }
  .sub { color: var(--muted); margin: 0; }

  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 48px; }
  .project {
    display: grid; grid-template-rows: auto 1fr; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); color: inherit; text-decoration: none;
    transition: transform .15s ease;
  }
  .project:hover { transform: translateY(-3px); }
  @media (prefers-reduced-motion: reduce) { .project { transition: none; } .project:hover { transform: none; } }
  .project img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--green-soft); }
  .project-body { padding: 14px 18px 18px; }
  .tag { display: inline-block; background: var(--green-soft); color: var(--green); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 1px 10px; }
  .project h3 { margin: 8px 0 2px; font-size: 20px; }
  .project p { margin: 0; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shawn的<span>作品集</span></h1>
    <p class="sub">我的實驗、觀察和作品都放在這裡。</p>
  </header>

  <h2>我的作品</h2>
  <section class="projects">
    <a class="project" href="firefly/">
      <img src="firefly/photos/all-on.jpg" alt="燈全開的螢火蟲盒子作品">
      <div class="project-body">
        <span class="tag">美勞作品 · 2026年11月</span>
        <h3>螢火蟲盒子</h3>
        <p>把盒子塗黑、裝上燈，做出有螢火蟲發光的夜晚。</p>
      </div>
    </a>
    <a class="project" href="mung-bean/">
      <img src="mung-bean/photos/day6.jpg" alt="綠豆苗長出綠色葉子">
      <div class="project-body">
        <span class="tag">自然觀察 · 2026年11月</span>
        <h3>綠豆發芽日記</h3>
        <p>用濕棉花種綠豆，記錄 7 天從發芽到長出葉子。</p>
      </div>
    </a>
  </section>

  <footer>Shawn · 2026</footer>
</div>
</body>
</html>
